<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Aprisa</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f6fa}
h2{padding:20px 20px 5px}
.sub{padding:0 20px;font-size:13px;color:#555}
.kategori{background:#fffa65;padding:12px 20px;font-weight:bold;margin:15px 0}
.container{display:flex;flex-wrap:wrap;gap:20px;padding:0 20px}
.card{background:white;width:230px;border-radius:8px;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,0.1);position:relative}
.card img{width:100%;height:130px;object-fit:contain}
.badge{position:absolute;top:8px;left:8px;font-size:11px;color:white;padding:3px 6px;border-radius:3px}
.merah{background:red}.hijau{background:green}
.card h3{font-size:14px;margin:8px 0 3px}
.card p{color:#d63031;font-weight:bold;font-size:13px}
.btn{background:#0984e3;color:white;border:none;width:100%;padding:8px;border-radius:5px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>

<h2>Kartu Produk Toko</h2>
<p class="sub">Aprisa - 2510010286 - 3B NON REG BJB - Tugas 5 Box Model & Position</p>

<div class="kategori">Kategori: Elektronik & Fashion Terlaris</div>

<div class="container">

<div class="card">
<span class="badge merah">Diskon 50%</span>
<img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=300" alt="Laptop">
<h3>Laptop Gaming Aprisa</h3>
<p>Rp 14.500.000</p>
<button class="btn">Beli</button>
</div>

<div class="card">
<span class="badge hijau">Baru</span>
<img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300" alt="Headphone">
<h3>Headphone Bass</h3>
<p>Rp 114.000</p>
<button class="btn">Beli</button>
</div>

<div class="card">
<span class="badge merah">Diskon</span>
<img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300" alt="Tas">
<h3>Tas Kuliah 3B</h3>
<p>Rp 107.000</p>
<button class="btn">Beli</button>
</div>

<div class="card">
<span class="badge merah">Best Seller</span>
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300" alt="Sepatu">
<h3>Sepatu Ngoding</h3>
<p>Rp 314.000</p>
<button class="btn">Beli</button>
</div>

</div>
</body>
</html>

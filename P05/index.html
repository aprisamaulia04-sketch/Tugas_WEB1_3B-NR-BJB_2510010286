<!DOCTYPE html>
<html>

.card h3{margin:10px 0 5px}
.card p{color:green;font-weight:bold}
button{background:#007bff;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer}
</style>
</head>

<h1>Toko Online Aprisa - 2510010286</h1>

  </div>
  <div class="card">
    <img src="headphone.jpeg">
    <h3>Headphone</h3>
    <p>Rp 500.000</p>
    <button>Beli</button>
  </div>
  <div class="card">
    <img src="tas.jpeg">
    <h3>Tas Ransel</h3>

  </div>
  <div class="card">

  </div>
</div>
</body>
</html>
